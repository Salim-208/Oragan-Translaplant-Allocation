<text x="60" y="3094" class="title" style="font-size:24px">RELATIONSHIPS (parent 1 → child many unless shown)</text>
<text x="64" y="3128" class="rel">HOSPITALS  →  HOSPITAL_ACCOUNTS : 1 — 0..1  has login</text>
<text x="64" y="3147" class="rel">ADMIN_ACCOUNTS  →  AUTH_SESSIONS : 1 — many  creates</text>
<text x="64" y="3166" class="rel">HOSPITALS  →  AUTH_SESSIONS : 1 — many  creates</text>
<text x="64" y="3185" class="rel">DONORS  →  ORGANS : 1 — many  provides</text>
<text x="64" y="3204" class="rel">HOSPITALS  →  ORGANS : 1 — many  donor site</text>
<text x="64" y="3223" class="rel">HOSPITALS  →  RECIPIENTS : 1 — many  registers</text>
<text x="64" y="3242" class="rel">HOSPITALS  →  ORGAN_REQUESTS : 1 — many  submits</text>
<text x="64" y="3261" class="rel">RECIPIENTS  →  ORGAN_REQUESTS : 1 — many  optional reference</text>
<text x="64" y="3280" class="rel">HOSPITALS  →  DONATION_OFFERS : 1 — many  submits</text>
<text x="1074" y="3128" class="rel">ORGANS  →  DONATION_OFFERS : 1 — many  optional link</text>
<text x="1074" y="3147" class="rel">ORGANS  →  ALLOCATIONS : 1 — 0..1  allocated once</text>
<text x="1074" y="3166" class="rel">RECIPIENTS  →  ALLOCATIONS : 1 — many  receives</text>
<text x="1074" y="3185" class="rel">HOSPITALS  →  ALLOCATIONS : 1 — many  recipient hospital</text>
<text x="1074" y="3204" class="rel">ORGANS  →  RESOURCE_LOCKS : 1 — 0..1  locked</text>
<text x="1074" y="3223" class="rel">HOSPITALS  →  RESOURCE_LOCKS : 1 — many  lock owner</text>
<text x="1074" y="3242" class="rel">HOSPITALS  →  HOSPITAL_DISTANCES : 1 — many  from / to</text>
<text x="1074" y="3261" class="rel">HOSPITALS  →  NOTIFICATIONS : 1 — many  receives</text>
<text x="1074" y="3280" class="rel">HOSPITALS  →  ALLOCATION_EVENTS : 1 — many  event context (optional)</text>
